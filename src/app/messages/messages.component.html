<div *ngIf="messageService.messages.length" class="messages-panel">
  <div class="messages-header">
    <h2>Messages</h2>
    <button class="clear" (click)="messageService.clear()">Clear</button>
  </div>

  <div *ngFor="let message of messageService.messages" class="message-item">
    {{ message }}
  </div>
</div>
