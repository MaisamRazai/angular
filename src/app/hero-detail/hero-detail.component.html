<section *ngIf="hero" class="hero-detail">
  <h2>{{ hero.name | uppercase }} Details</h2>

  <div class="hero-info">
    <span class="hero-label">ID:</span>
    <span>{{ hero.id }}</span>
  </div>

  <label class="hero-field">
    Name
    <input [(ngModel)]="hero.name" placeholder="Enter hero name" />
  </label>

  <div class="hero-actions">
    <button type="button" (click)="goBack()">Go back</button>
  </div>
</section>
